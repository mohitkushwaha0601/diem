<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Daily News Archive</title>
  <style>
    :root {
      --bg: #f4efe8;
      --paper: #fffdf9;
      --ink: #1a2a35;
      --muted: #5a6973;
      --navy: #153c5b;
      --saffron: #c76b2c;
      --green: #28624d;
      --line: #d8d0c1;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Georgia, "Times New Roman", serif;
      background: var(--bg);
      color: var(--ink);
      line-height: 1.6;
    }
    header {
      background: var(--navy);
      color: #fff;
      border-bottom: 6px solid var(--saffron);
      padding: 42px 20px 30px;
    }
    .wrap {
      max-width: 980px;
      margin: 0 auto;
    }
    .eyebrow {
      margin: 0 0 8px;
      color: #f7d7b7;
      font: 700 12px/1.2 Arial, sans-serif;
      letter-spacing: 0.14em;
      text-transform: uppercase;
    }
    h1 {
      margin: 0;
      font-size: clamp(2.2rem, 5vw, 4rem);
      line-height: 1.08;
    }
    .subtitle {
      margin: 14px 0 0;
      max-width: 700px;
      color: #e7edf0;
      font-size: 1.08rem;
    }
    main {
      padding: 26px 20px 52px;
    }
    .card {
      background: var(--paper);
      border: 1px solid var(--line);
      border-left: 5px solid var(--green);
      box-shadow: 0 2px 0 rgba(21, 60, 91, 0.06);
      padding: 24px;
    }
    .card h2 {
      margin-top: 0;
      font-size: 1.6rem;
    }
    ul {
      list-style: none;
      padding: 0;
      margin: 16px 0 0;
      display: grid;
      gap: 12px;
    }
    li {
      background: #f5f8f7;
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 14px 16px;
    }
    a {
      color: #0f5771;
      text-decoration: none;
      font-weight: 700;
    }
    a:hover { text-decoration: underline; }
    .meta {
      display: inline-block;
      margin-right: 8px;
      font: 700 11px/1 Arial, sans-serif;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--green);
    }
    footer {
      border-top: 1px solid var(--line);
      padding: 20px;
      color: var(--muted);
      font: 13px/1.5 Arial, sans-serif;
    }
  </style>
</head>
<body>
  <header>
    <div class="wrap">
      <p class="eyebrow">Current Affairs Archive</p>
      <h1>Daily News Briefs</h1>
      <p class="subtitle">A simple index to access daily SSB-oriented current affairs pages hosted via GitHub Pages.</p>
    </div>
  </header>

  <main class="wrap">
    <section class="card">
      <h2>Browse by date</h2>
      <ul>
        <li>
          <span class="meta">Date</span>
          <a href="./Dates/24september2026.html">24 September 2026</a>
        </li>
      </ul>
    </section>
  </main>

  <footer>
    <div class="wrap">Add more dated pages in the Dates folder and link them here for a complete archive.</div>
  </footer>
</body>
</html>
